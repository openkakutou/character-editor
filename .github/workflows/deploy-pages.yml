name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a floating tag — matches
      # this org's existing CI convention (see web-ui-kit's release.yml).
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Must run before Test: the WASM bridge test suite loads
      # public/wasm/wasm_exec.js directly, the same way the app itself
      # does at runtime — see src/wasm/bridge.test.ts.
      #
      # Pinned to an exact character release. Bumped as a follow-up step
      # of character's own /vibe:release, per roadmap's
      # .vibe/decisions/016-wasm-version-pinning-push-based-propagation.md
      # — see this repo's own CLAUDE.md ("WASM dependency on character")
      # for where that pin lives.
      - name: Download character WASM release
        run: npm run wasm:download -- v0.9.0

      - name: Test
        run: npm test

      - name: Lint
        run: npx biome check .

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  # A genuinely separate job (not steps in `build` above) — own checkout,
  # install, and WASM download — so Playwright's Chromium download/cache
  # never delays the fast Test/Lint/Build feedback loop, per backlog item
  # 016's own acceptance criterion ("runs in CI as its own job, separate
  # from npm test"). `deploy` below only runs once this job (and `build`)
  # both pass, so a real rendering regression blocks publishing the same
  # way a failing unit test already does.
  visual:
    runs-on: ubuntu-latest
    # Runs inside Playwright's own published image instead of installing
    # Chromium onto the bare `ubuntu-latest` runner: `playwright install
    # --with-deps chromium` on the runner produced font-rendering (glyph
    # metrics, antialiasing) that didn't match whatever machine the
    # committed baseline PNGs were captured on, so the animation editor's
    # Clsn-boxes screenshot failed intermittently right at the diff
    # threshold on every push since it was added — an environment
    # mismatch, not real flakiness (see `character-viewer-web`'s
    # `.vibe/decisions/023`, the sibling repo where the identical root
    # cause was found and fixed first). The image already bundles a
    # matching Chromium + fonts for this exact `@playwright/test` version,
    # so a baseline regenerated via this same image (see `docs/testing.md`)
    # always matches what CI renders. Pinned by digest, tag
    # `v1.62.1-noble` — bump both together with the `@playwright/test`
    # version in package.json, and regenerate every baseline through the
    # new image before merging.
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e # v1.62.1-noble
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # See the "Download character WASM release" step in the build job
      # above — same reason: every surface this suite screenshots decodes a
      # real sprite through the same real WASM build at runtime.
      - name: Download character WASM release
        run: npm run wasm:download -- v0.9.0

      - name: Visual regression tests
        run: npm run test:visual

      - name: Upload visual regression diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-diff
          path: test-results/
          retention-days: 14

  deploy:
    needs: [build, visual]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
